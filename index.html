<script>
async function generateVideo() {
  const promptInput = document.getElementById("prompt");
  const styleInput = document.getElementById("style");
  const durationInput = document.getElementById("duration");
  const ratioInput = document.getElementById("ratio");

  const prompt = promptInput ? promptInput.value.trim() : "";
  const style = styleInput ? styleInput.value : "";
  const duration = durationInput ? durationInput.value : "5";
  const aspectRatio = ratioInput ? ratioInput.value : "16:9";

  if (!prompt) {
    alert("Please enter a video prompt first.");
    return;
  }

  try {
    alert("🎬 Starting your video...");

    const response = await fetch(
      "https://vidzai-api-5i2j.onrender.com/api/generate",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          prompt: prompt,
          style: style,
          duration: duration,
          aspectRatio: aspectRatio
        })
      }
    );

    const data = await response.json();

    console.log("VidzAI response:", data);

    if (!response.ok) {
      alert(
        "❌ Video generation failed:\n" +
        (data.error || "Unknown server error")
      );
      return;
    }

    alert(
      "✅ Video generation has started!\n\n" +
      "Your video is being created."
    );

  } catch (error) {
    console.error("VidzAI error:", error);

    alert(
      "❌ Could not connect to the VidzAI server.\n\n" +
      "Please try again."
    );
  }
}
</script>
