<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VidzAI - AI Video Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #08080f;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #24243a;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      color: #aaa;
      margin: 8px 0 0;
    }

    .container {
      width: 92%;
      max-width: 800px;
      margin: 40px auto;
    }

    .card {
      background: #11111c;
      border: 1px solid #292940;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    textarea,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #34344d;
      background: #090914;
      color: white;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #6c5ce7;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #191928;
      color: #ccc;
      display: none;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 VidzAI</h1>
    <p>Create AI videos from your ideas</p>
  </header>

  <main class="container">

    <div class="card">

      <label for="prompt">Describe your video</label>

      <textarea
        id="prompt"
        placeholder="Example: A woman dancing in a colorful African market, cinematic and realistic"
      ></textarea>

      <label for="style">Style</label>

      <select id="style">
        <option value="cinematic">Cinematic</option>
        <option value="realistic">Realistic</option>
        <option value="anime">Anime</option>
        <option value="3D animation">3D Animation</option>
        <option value="cartoon">Cartoon</option>
      </select>

      <label for="duration">Duration</label>

      <select id="duration">
        <option value="5">5 seconds</option>
        <option value="10">10 seconds</option>
      </select>

      <label for="ratio">Aspect Ratio</label>

      <select id="ratio">
        <option value="16:9">16:9 Landscape</option>
        <option value="9:16">9:16 Portrait</option>
        <option value="1:1">1:1 Square</option>
      </select>

      <button id="generateButton" onclick="generateVideo()">
        🎬 Generate Video
      </button>

      <div id="status"></div>

    </div>

  </main>

  <footer>
    © 2026 VidzAI
  </footer>

  <script>

    async function generateVideo() {

      const button = document.getElementById("generateButton");
      const status = document.getElementById("status");

      const prompt = document.getElementById("prompt").value.trim();
      const style = document.getElementById("style").value;
      const duration = document.getElementById("duration").value;
      const aspectRatio = document.getElementById("ratio").value;

      if (!prompt) {
        status.style.display = "block";
        status.innerText = "⚠️ Please enter a video description first.";
        return;
      }

      button.disabled = true;
      button.innerText = "⏳ Starting...";

      status.style.display = "block";
      status.innerText = "🎬 Connecting to VidzAI...";

      try {

        const response = await fetch(
          "https://vidzai-api-5i2j.onrender.com/api/generate",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              prompt: prompt,
              style: style,
              duration: duration,
              aspectRatio: aspectRatio
            })
          }
        );

        const data = await response.json();

        console.log("VidzAI:", data);

        if (!response.ok) {

          status.innerText =
            "❌ Generation failed.\n\n" +
            (data.error || "Unknown server error.");

          return;
        }

        status.innerText =
          "✅ Video generation started!\n\n" +
          "Your AI video is being created.";

      } catch (error) {

        console.error(error);

        status.innerText =
          "❌ Could not connect to the VidzAI server.\n\n" +
          "Please try again.";

      } finally {

        button.disabled = false;
        button.innerText = "🎬 Generate Video";

      }

    }

  </script>

</body>
</html>
