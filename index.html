<script>
async function generateVideo() {
  const prompt = document.getElementById("prompt").value.trim();
  const style = document.getElementById("style").value;
  const durationText = document.getElementById("duration").value;
  const ratioText = document.getElementById("ratio").value;

  if (!prompt) {
    alert("Please describe the video you want to create.");
    return;
  }

  const duration = parseInt(durationText) || 5;

  let aspectRatio = "16:9";
  if (ratioText.includes("9:16")) {
    aspectRatio = "9:16";
  } else if (ratioText.includes("1:1")) {
    aspectRatio = "1:1";
  }

  try {
    alert("🎬 Starting your video...");

    const response = await fetch(
      "https://vidzai-api-5i2j.onrender.com/api/generate",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          prompt: prompt,
          style: style,
          duration: duration,
          aspectRatio: aspectRatio
        })
      }
    );

    const data = await response.json();

    console.log("VidzAI response:", data);

    if (!response.ok) {
      alert(
        "❌ Generation failed:\n" +
        (data.error || "Unknown error")
      );
      return;
    }

    alert(
      "✅ Video generation has started!\n\n" +
      "Your video is being created."
    );

  } catch (error) {
    console.error("VidzAI error:", error);
    alert("❌ Could not connect to the VidzAI server.");
  }
}
</script>
